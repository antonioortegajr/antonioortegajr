name: Lighthouse

# Two ways to skip this check on pull requests:
# - Docs-only PRs (changes under docs/ or any .md file) skip automatically, since
#   they can't affect the built site.
# - Add the `skip-lighthouse` label to skip the job by hand (e.g. when GitHub or
#   Lighthouse is having trouble). Adding the label only affects runs started
#   afterward, so push again to re-run. `workflow_dispatch` has no PR, so it always runs.
on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-lighthouse') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        run: npm run build
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
      - name: Write Lighthouse summary
        if: always()
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/lighthouse-summary.md"
          {
            echo "## Lighthouse report"
            echo
            if [ -f .lighthouseci/manifest.json ]; then
              echo "| URL | Performance | Accessibility | Best Practices | SEO |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '
                def score: if . == null then "n/a" else (. * 100 | round | tostring) end;
                def path_only: gsub("https?://[^/]+"; "");
                .[] | select(.isRepresentativeRun) |
                "| \(.url | path_only) | \(.summary.performance | score) | \(.summary.accessibility | score) | \(.summary["best-practices"] | score) | \(.summary.seo | score) |"
              ' .lighthouseci/manifest.json
              echo
              echo "[View full run details]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              echo "Full HTML reports are in the \`lighthouse-reports\` artifact."
            else
              echo "No Lighthouse manifest found."
            fi
          } > "$SUMMARY_FILE"
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment Lighthouse scores on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY_FILE="$RUNNER_TEMP/lighthouse-summary.md"
          {
            echo "<!-- lighthouse-report -->"
            cat "$SUMMARY_FILE"
          } > "$RUNNER_TEMP/lighthouse-comment.md"
          COMMENTS=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --paginate)
          COMMENT_ID=$(echo "$COMMENTS" | jq -r '.[] | select(.body | startswith("<!-- lighthouse-report -->")) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ] && [ "$COMMENT_ID" != "null" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" -f body="$(cat "$RUNNER_TEMP/lighthouse-comment.md")"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$(cat "$RUNNER_TEMP/lighthouse-comment.md")"
          fi
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
